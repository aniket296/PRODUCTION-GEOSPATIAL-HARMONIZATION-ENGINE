# ==============================================================================
# SIH26013: Multi-Source Geospatial Data Harmonization Engine
# Redis 7 Alpine Production Configuration (Step 5/150)
# ==============================================================================

# Network & Connectivity
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Configuration & Eviction Policy
# Celery queues require noeviction to ensure spatial tasks are never dropped
maxmemory 512mb
maxmemory-policy noeviction

# Persistence & Durability
save 900 1
save 300 10
save 60 1000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF) for task queue reliability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
