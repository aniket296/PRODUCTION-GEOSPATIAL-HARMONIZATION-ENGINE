[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadastral-harmonization-engine"
version = "0.1.0"
description = "SIH26013: Multi-Source Geospatial Data Harmonization Engine for Urban Land Records"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary / Government of India - Ministry of Rural Development" }
authors = [
    { name = "Geospatial Engineering Team", email = "cadastre-team@local" }
]
keywords = [
    "geospatial",
    "cadastre",
    "postgis",
    "shapely",
    "fastapi",
    "land-records",
    "topology",
    "harmonization"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # Core Framework & Settings (Pydantic v2)
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",

    # Database & ORM (SQLAlchemy 2.x, PostGIS)
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "geoalchemy2>=0.15.1",

    # Geospatial Processing Engine
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "geopandas>=1.0.1",
    "fiona>=1.9.6",
    "ezdxf>=1.3.0",
    "flatgeobuf>=3.28.0",

    # Distributed Task Queue & Messaging
    "celery>=5.4.0",
    "redis>=5.0.4",

    # S3-Compatible Object Storage
    "minio>=7.2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pyyaml>=6.0.1",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
