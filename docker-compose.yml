# ==============================================================================
# SIH26013: Multi-Source Geospatial Data Harmonization Engine
# Base Docker Compose Configuration (Step 2/150)
# ==============================================================================

name: cadastre_engine

# Common Reusable Service Configurations
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

x-service-defaults: &service-defaults
  <<: *default-logging
  restart: unless-stopped
  networks:
    - cadastre_net

x-backend-common-env: &backend-common-env
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-cadastre_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadastre_secure_password}
  POSTGRES_DB: ${POSTGRES_DB:-cadastre_db}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cadastre_user:cadastre_secure_password@postgres:5432/cadastre_db}
  DATABASE_SYNC_URL: ${DATABASE_SYNC_URL:-postgresql+psycopg2://cadastre_user:cadastre_secure_password@postgres:5432/cadastre_db}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password}
  MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-cadastral-raw}
  MINIO_BUCKET_HARMONIZED: ${MINIO_BUCKET_HARMONIZED:-cadastral-harmonized}

# Services
services:
  postgres:
    <<: *service-defaults
    image: postgis/postgis:16-3.4
    container_name: cadastre_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cadastre_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadastre_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-cadastre_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cadastre_user} -d ${POSTGRES_DB:-cadastre_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: cadastre_redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: cadastre_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password}
      MINIO_BROWSER: "on"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Isolated High-Performance Cadastral Network
networks:
  cadastre_net:
    name: cadastre_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# Persistent Local Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
